# Déploiement de démonstration MaintiDoc.
#   docker compose up -d --build                    # Ollama déjà installé sur l'hôte (OLLAMA_HOST dans .env)
#   docker compose --profile ollama up -d --build   # Ollama dans un conteneur (serveur, GPU conseillé)
# Les secrets sont lus dans un fichier .env non versionné : voir .env.example.
services:
  qdrant:
    image: qdrant/qdrant:v1.20.0   # même version mineure que qdrant-client
    volumes: [qdrant_data:/qdrant/storage]
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: maintidoc
      POSTGRES_USER: maintidoc
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?définir POSTGRES_PASSWORD dans .env}
    volumes: [pg_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U maintidoc"]
      interval: 5s
      retries: 20
    restart: unless-stopped

  # Stockage des documents dans MinIO : facultatif (profil « minio »). L'image officielle minio/minio n'est plus
  # publiée sur Docker Hub ; on utilise ici le fork communautaire pgsty/minio (à valider par votre politique de
  # sécurité, ou à remplacer par votre propre service S3). Activer avec MAINTIDOC_S3_ENDPOINT=minio:9000 dans .env.
  minio:
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    profiles: ["minio"]
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-maintidoc}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-}
    volumes: [minio_data:/data]
    ports: ["127.0.0.1:9001:9001"]   # console d'administration, accessible en local uniquement
    restart: unless-stopped

  ollama:
    image: ollama/ollama:0.12.0
    profiles: ["ollama"]
    volumes: [ollama_models:/root/.ollama]
    restart: unless-stopped
    # Machine avec GPU NVIDIA (cible : 24 Go, qwen2.5vl:7b) :
    # deploy:
    #   resources:
    #     reservations:
    #       devices: [{driver: nvidia, count: 1, capabilities: [gpu]}]

  api:
    build: .
    env_file: .env
    environment:
      QDRANT_URL: http://qdrant:6333
      OLLAMA_HOST: ${OLLAMA_HOST:-http://ollama:11434}
      MAINTIDOC_DB_URL: postgresql://maintidoc:${POSTGRES_PASSWORD}@postgres:5432/maintidoc
      MAINTIDOC_S3_ENDPOINT: ${MAINTIDOC_S3_ENDPOINT:-}   # vide : documents lus dans l'image ; minio:9000 avec le profil minio
      MAINTIDOC_S3_ACCESS_KEY: ${MINIO_ROOT_USER}
      MAINTIDOC_S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      MAINTIDOC_VLM: ${MAINTIDOC_VLM:-qwen2.5vl:3b}
      MAINTIDOC_MAX_SECONDS: ${MAINTIDOC_MAX_SECONDS:-600}
    extra_hosts: ["host.docker.internal:host-gateway"]
    volumes: [app_data:/app/data]
    ports: ["127.0.0.1:8000:8000"]
    depends_on:
      qdrant: {condition: service_started}
      postgres: {condition: service_healthy}
    restart: unless-stopped

  ui:
    build: .
    command: ["streamlit", "run", "ui/app.py", "--server.port", "8501", "--server.address", "0.0.0.0"]
    environment:
      MAINTIDOC_API: http://api:8000
    ports: ["127.0.0.1:8501:8501"]
    depends_on: [api]
    restart: unless-stopped

volumes:
  qdrant_data:
  pg_data:
  minio_data:
  ollama_models:
  app_data:
