name: CI MaintiDoc

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  qualite:
    name: Analyse statique
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install ruff==0.15.0
      # erreurs bloquantes uniquement : syntaxe, noms non définis, imports invalides
      - run: ruff check --select E9,F63,F7,F82,F821 maintidoc mcp_server api ui eval scripts tests

  secrets:
    name: Recherche de secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dependances:
    name: Audit des dépendances
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install pip-audit==2.9.0
      - run: pip-audit -r requirements.txt --progress-spinner off

  tests:
    name: Tests automatisés
    runs-on: ubuntu-latest
    needs: qualite
    env:
      MAINTIDOC_APPROVAL_SECRET: ci-only-not-a-secret
      MAINTIDOC_JWT_SECRET: ci-only-not-a-secret
      HF_HUB_DISABLE_TELEMETRY: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12', cache: pip}
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/huggingface
            ~/.EasyOCR
          key: modeles-${{ hashFiles('maintidoc/config.py') }}
      - run: pip install --index-url https://download.pytorch.org/whl/cpu torch==2.15.0 torchvision==0.29.2
      - run: pip install -r requirements.txt
      # Les tests utilisent un LLM simulé (pas d'Ollama en CI) et le vrai serveur MCP en stdio.
      - run: pytest

  image:
    name: Construction de l'image Docker
    runs-on: ubuntu-latest
    needs: tests
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t maintidoc:ci .
      - run: cp .env.example .env && docker compose config --quiet && docker compose --profile minio --profile ollama config --quiet
